apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespaces.yaml
  - 10-postgres.yaml
  - 20-minio.yaml
  - 21-minio-seed.yaml
  - 30-metabase.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-init
    namespace: warehouse
    files:
      - postgres/init.sh
  - name: postgres-hba
    namespace: warehouse
    files:
      - postgres/pg_hba.conf
  - name: sales-csv
    namespace: ingest
    files:
      - data/sales.csv
  - name: minio-policy
    namespace: ingest
    files:
      - minio/raw-read.json
  - name: metabase-setup
    namespace: bi
    files:
      - metabase/setup.sh

secretGenerator:
  - name: postgres-credentials
    namespace: warehouse
    envs:
      - secrets/warehouse.env
  - name: postgres-tls
    namespace: warehouse
    files:
      - tls.crt=secrets/postgres-tls.crt
      - tls.key=secrets/postgres-tls.key
  - name: minio-credentials
    namespace: ingest
    envs:
      - secrets/ingest.env
  - name: minio-tls
    namespace: ingest
    files:
      - tls.crt=secrets/minio-tls.crt
      - tls.key=secrets/minio-tls.key
      - ca.crt=secrets/ca.crt
  - name: metabase-credentials
    namespace: bi
    envs:
      - secrets/bi.env
