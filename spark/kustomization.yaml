apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-rbac.yaml
  - 20-sales-etl.yaml
  - 30-spark-ui.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: spark-executor-template
    namespace: processing
    files:
      - executor-template.yaml

secretGenerator:
  - name: spark-credentials
    namespace: processing
    envs:
      - secrets/processing.env
