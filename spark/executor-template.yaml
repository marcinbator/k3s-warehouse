apiVersion: v1
kind: Pod
metadata:
  labels:
    app: sales-etl
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 185
    runAsGroup: 185
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: executor
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tls
          mountPath: /opt/spark/tls
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tls
      configMap:
        name: spark-tls
    - name: tmp
      emptyDir: {}
