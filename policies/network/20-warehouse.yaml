apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: warehouse
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: processing
          podSelector:
            matchLabels:
              app: sales-etl
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bi
          podSelector:
            matchLabels:
              app: metabase
      ports:
        - protocol: TCP
          port: 5432
