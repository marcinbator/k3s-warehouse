apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sales-etl
  namespace: processing
spec:
  podSelector:
    matchLabels:
      app: sales-etl
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sales-etl
      ports:
        - protocol: TCP
          port: 7078
        - protocol: TCP
          port: 7079
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sales-etl
      ports:
        - protocol: TCP
          port: 7078
        - protocol: TCP
          port: 7079
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingest
          podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: warehouse
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 6443
