apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metabase
  namespace: bi
spec:
  podSelector:
    matchLabels:
      app: metabase
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: metabase-setup
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: warehouse
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metabase-setup-egress
  namespace: bi
spec:
  podSelector:
    matchLabels:
      app: metabase-setup
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: metabase
      ports:
        - protocol: TCP
          port: 3000
